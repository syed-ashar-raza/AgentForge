[project]
name = "agentforge"
version = "0.1.0"
description = "Production-oriented local AI agent platform with tools, memory, planning, evaluation, and FastAPI."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
